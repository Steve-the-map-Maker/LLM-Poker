services:
  # Backend Web Service
  - type: web
    name: poker-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FRONTEND_URL
        sync: false # Set this to your frontend URL after deployment

  # Frontend Static Site
  - type: web
    name: poker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false # Set this to your backend URL after deployment (e.g. https://poker-backend.onrender.com/api/v1/game)
